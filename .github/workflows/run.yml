name: Update Data
on:
  schedule:
    - cron: '0 3 * * *' # Запуск в 3 утра ежедневно
  workflow_dispatch: # Кнопка для ручного запуска
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Обновлено с v3 до v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Обновлено с v4 до v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install gspread oauth2client cloudscraper

      - name: Run Scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python main.py
